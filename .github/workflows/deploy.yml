name: Deploy via FTP

# Dezactivat 1 aug 2026: cursurilapahar.ro e servit integral de Next pe Vercel
# (inclusiv /admin), care deployează automat la push pe main. FTP-ul ducea PHP-ul
# legacy pe Hostico, unde nu mai intră nimeni. Rămâne pornibil manual din Actions.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to cursurilapahar.ro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.claude/**
            .claude/
            data/**
            admin/statistici/data/**
            admin/statistici/uploads/**
